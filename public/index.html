<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Trading Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="container">
                <div class="logo">ForexTrade</div>
                <div class="nav-links">
                    <span id="userDisplay" class="user-display"></span>
                    <button id="logoutBtn" class="btn btn-secondary" style="display:none;">Logout</button>
                </div>
            </div>
        </nav>

        <div id="authScreen" class="auth-screen">
            <div class="auth-container">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>

                <div id="loginForm" class="tab-content active">
                    <h2>Login</h2>
                    <input type="email" id="loginEmail" placeholder="Email" class="input-field">
                    <input type="password" id="loginPassword" placeholder="Password" class="input-field">
                    <button id="loginBtn" class="btn btn-primary">Login</button>
                    <p id="loginError" class="error-message"></p>
                </div>

                <div id="registerForm" class="tab-content">
                    <h2>Register</h2>
                    <input type="text" id="regUsername" placeholder="Username" class="input-field">
                    <input type="email" id="regEmail" placeholder="Email" class="input-field">
                    <input type="password" id="regPassword" placeholder="Password" class="input-field">
                    <input type="text" id="regFirstName" placeholder="First Name" class="input-field">
                    <input type="text" id="regLastName" placeholder="Last Name" class="input-field">
                    <button id="registerBtn" class="btn btn-primary">Register</button>
                    <p id="registerError" class="error-message"></p>
                </div>
            </div>
        </div>

        <div id="mainScreen" class="main-screen" style="display:none;">
            <div class="container">
                <div class="dashboard">
                    <aside class="sidebar">
                        <button class="menu-btn active" data-menu="dashboard">Dashboard</button>
                        <button class="menu-btn" data-menu="trade">Place Trade</button>
                        <button class="menu-btn" data-menu="trades">My Trades</button>
                        <button class="menu-btn" data-menu="deposit">Deposit</button>
                        <button class="menu-btn" data-menu="deposits">Deposit History</button>
                        <button class="menu-btn" data-menu="account">Account Settings</button>
                    </aside>

                    <main class="content">
                        <section id="dashboard" class="menu-section active">
                            <h1>Dashboard</h1>
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <h3>Account Balance</h3>
                                    <p id="balanceDisplay">$0.00</p>
                                </div>
                                <div class="stat-card">
                                    <h3>Total Trades</h3>
                                    <p id="totalTradesDisplay">0</p>
                                </div>
                                <div class="stat-card">
                                    <h3>Win Rate</h3>
                                    <p id="winRateDisplay">0%</p>
                                </div>
                                <div class="stat-card">
                                    <h3>Total Profit</h3>
                                    <p id="totalProfitDisplay">$0.00</p>
                                </div>
                            </div>
                        </section>

                        <section id="trade" class="menu-section">
                            <h1>Place a Trade</h1>
                            <div class="trade-form">
                                <div class="form-group">
                                    <label>Currency Pair</label>
                                    <select id="tradePair" class="input-field">
                                        <option>EUR/USD</option>
                                        <option>GBP/USD</option>
                                        <option>USD/JPY</option>
                                        <option>USD/CHF</option>
                                        <option>AUD/USD</option>
                                        <option>USD/CAD</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Direction</label>
                                    <div class="button-group">
                                        <button class="btn-direction active" data-type="CALL">CALL (Up)</button>
                                        <button class="btn-direction" data-type="PUT">PUT (Down)</button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label>Amount ($)</label>
                                    <input type="number" id="tradeAmount" placeholder="10" min="1" class="input-field">
                                </div>

                                <div class="form-group">
                                    <label>Duration</label>
                                    <select id="tradeDuration" class="input-field">
                                        <option>1m</option>
                                        <option>5m</option>
                                        <option>15m</option>
                                        <option>1h</option>
                                        <option>4h</option>
                                        <option>1d</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Return %</label>
                                    <input type="number" id="returnPercentage" placeholder="80" value="80" min="50" max="90" class="input-field">
                                </div>

                                <button id="placeTradeBtn" class="btn btn-primary btn-large">Place Trade</button>
                                <p id="tradeError" class="error-message"></p>
                            </div>
                        </section>

                        <section id="trades" class="menu-section">
                            <h1>My Trades</h1>
                            <div id="tradesContainer" class="trades-container">
                                <p>No trades yet</p>
                            </div>
                        </section>

                        <section id="deposit" class="menu-section">
                            <h1>Make a Deposit</h1>
                            <div class="deposit-form">
                                <div class="form-group">
                                    <label>Amount ($)</label>
                                    <input type="number" id="depositAmount" placeholder="50" min="10" class="input-field">
                                </div>

                                <div class="form-group">
                                    <label>Payment Method</label>
                                    <select id="depositMethod" class="input-field">
                                        <option value="CREDIT_CARD">Credit Card</option>
                                        <option value="DEBIT_CARD">Debit Card</option>
                                        <option value="BANK_TRANSFER">Bank Transfer</option>
                                        <option value="E_WALLET">E-Wallet</option>
                                    </select>
                                </div>

                                <button id="depositBtn" class="btn btn-primary btn-large">Deposit Now</button>
                                <p id="depositError" class="error-message"></p>
                            </div>
                        </section>

                        <section id="deposits" class="menu-section">
                            <h1>Deposit History</h1>
                            <div id="depositsContainer" class="deposits-container">
                                <p>No deposits yet</p>
                            </div>
                        </section>

                        <section id="account" class="menu-section">
                            <h1>Account Settings</h1>
                            <div class="account-form">
                                <div class="form-group">
                                    <label>First Name</label>
                                    <input type="text" id="accountFirstName" class="input-field">
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" id="accountLastName" class="input-field">
                                </div>
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="tel" id="accountPhone" class="input-field">
                                </div>
                                <div class="form-group">
                                    <label>Country</label>
                                    <input type="text" id="accountCountry" class="input-field">
                                </div>
                                <button id="updateProfileBtn" class="btn btn-primary">Update Profile</button>
                                <p id="profileError" class="error-message"></p>
                            </div>
                        </section>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
